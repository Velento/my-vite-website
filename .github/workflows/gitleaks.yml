name: Secret scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # gitleaks-action v2 takes no `with:` inputs — configuration is via env.
      # GITHUB_TOKEN is required for PR scans (per the action's 8.x release notes).
      # The action uploads its own SARIF artifact when GITLEAKS_ENABLE_UPLOAD_ARTIFACT
      # is true (the default), so no separate upload step is needed.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
