name: CI

on:
  push:
    branches: [my-vite-website, 'feat/**', 'feature/**']
  pull_request:
    branches: [my-vite-website]

# Отменяем старые запуски той же ветки при новом пуше
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repo (no contents/PR/package
# writes), so cap the default GITHUB_TOKEN to read-only.
permissions:
  contents: read

jobs:
  # ── 1. Линтинг ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: TypeScript check (worker)
        run: npm run typecheck:worker

      - name: i18n parity check
        run: npm run check:i18n

      # Supply-chain gate: fail the build on a known high/critical vulnerability
      # in a production dependency. Dev-only tooling is excluded to avoid noise
      # from build-chain advisories that never ship to visitors.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ── 2. Тесты ────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint # Тесты запускаем только если lint прошёл
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── 3. Build check (all events, no secrets) ──────────────────────────────
  # Validates the app compiles cleanly. Secrets are intentionally omitted so
  # this step is safe to run for pull_request events (including from forks).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

