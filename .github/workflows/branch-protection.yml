name: Configure branch protection

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  administration: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure branch protection for `main`
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Setting branch protection for main"
          curl -X PUT "https://api.github.com/repos/$REPO/branches/main/protection" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{
              "required_status_checks": null,
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": true,
                "required_approving_review_count": 1
              },
              "restrictions": null,
              "required_linear_history": true,
              "allow_force_pushes": false,
              "allow_deletions": false
            }'

      - name: Configure branch protection for `my-vite-website`
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Setting branch protection for my-vite-website"
          curl -X PUT "https://api.github.com/repos/$REPO/branches/my-vite-website/protection" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{
              "required_status_checks": null,
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": true,
                "required_approving_review_count": 1
              },
              "restrictions": null,
              "required_linear_history": true,
              "allow_force_pushes": false,
              "allow_deletions": false
            }'
