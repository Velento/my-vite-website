name: Configure repository hardening

# Manual one-shot that applies repository hardening the default GITHUB_TOKEN
# cannot set:
#   1. Branch protection on `main` and `my-vite-website`
#   2. Repository settings (merge strategy, auto-delete branches, metadata)
#   3. HTTPS enforcement on GitHub Pages
#
# Requires `REPO_ADMIN_TOKEN` (a PAT with admin rights on this repo) as a
# repository secret (Account -> Developer settings -> Personal access tokens).
#
# To run: GitHub UI -> Actions -> "Configure repository hardening" -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Check admin token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::REPO_ADMIN_TOKEN is not set. Create a PAT with admin rights on this repo and add it as a repo secret."
            exit 1
          fi

      - name: Apply branch protection to `main` and `my-vite-website`
        # Solo-developer profile: no required reviewer count (would block the
        # owner from merging their own PRs), but PRs still required, linear
        # history enforced, no force-push, no branch deletion. Required CI
        # checks are listed by name - they must match the workflow job names.
        run: |
          for BRANCH in main my-vite-website; do
            echo "Configuring branch protection for $BRANCH"
            curl --fail-with-body -X PUT \
              "https://api.github.com/repos/$REPO/branches/$BRANCH/protection" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{
                "required_status_checks": {
                  "strict": true,
                  "contexts": ["Lint", "Tests", "Build"]
                },
                "enforce_admins": false,
                "required_pull_request_reviews": {
                  "dismiss_stale_reviews": true,
                  "require_code_owner_reviews": false,
                  "required_approving_review_count": 0
                },
                "restrictions": null,
                "required_linear_history": true,
                "allow_force_pushes": false,
                "allow_deletions": false
              }'
            echo
          done

      - name: Apply repository settings
        # Linear history is enforced above, so only squash merges are allowed
        # (merge commits and rebase merges are turned off). Merged branches are
        # auto-deleted to keep the branch list clean. The wiki is disabled - it
        # is unused and an editable public surface.
        run: |
          echo "Applying repository settings"
          curl --fail-with-body -X PATCH \
            "https://api.github.com/repos/$REPO" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{
              "description": "Legal Line - usługi legalizacji pobytu w Gdańsku. React + Vite + TypeScript.",
              "homepage": "https://legalline.pl",
              "delete_branch_on_merge": true,
              "allow_merge_commit": false,
              "allow_rebase_merge": false,
              "allow_squash_merge": true,
              "allow_auto_merge": true,
              "has_wiki": false
            }'
          echo

      - name: Enforce HTTPS on GitHub Pages
        # The site runs on a custom domain (legalline.pl); enforcing HTTPS
        # redirects every plain-http request to the secure origin.
        run: |
          echo "Enforcing HTTPS on GitHub Pages"
          curl --fail-with-body -X PUT \
            "https://api.github.com/repos/$REPO/pages" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"https_enforced": true}'
          echo
