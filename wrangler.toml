name = "legalline-form-proxy"
main = "worker/index.ts"
compatibility_date = "2026-04-01"

# ── Secrets (set via wrangler secret put …) ────────────────────────────────
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   REPORT_TOKEN              — bearer token guarding /report and /export

# ── Public vars ────────────────────────────────────────────────────────────
[vars]
ALLOWED_ORIGINS = "https://legalline.pl,https://www.legalline.pl"

# ── KV: server-side interaction log (lead audit trail) ─────────────────────
# Create the namespace once with:
#   wrangler kv:namespace create INTERACTION_LOG
# That command prints { id = "…" } — paste it below before the first deploy.
# For local `wrangler dev` you can also generate a preview namespace:
#   wrangler kv:namespace create INTERACTION_LOG --preview
[[kv_namespaces]]
binding = "INTERACTION_LOG"
id = "906303287ee844fdb3f852d2bc5a32b6"
# preview_id = "REPLACE_WITH_PREVIEW_ID"  # optional, for wrangler dev
