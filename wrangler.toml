name = "legalline-form-proxy"
main = "worker/index.ts"
compatibility_date = "2026-04-01"

# ── Secrets (set via wrangler secret put …) ────────────────────────────────
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   REPORT_TOKEN              — bearer token guarding /report and /export
#   HCAPTCHA_SECRET           — optional; when set, form submits must pass hCaptcha

# ── Public vars ────────────────────────────────────────────────────────────
[vars]
ALLOWED_ORIGINS = "https://legalline.pl,https://www.legalline.pl"

# ── KV: server-side interaction log (lead audit trail) ─────────────────────
# Create the namespace once with:
#   wrangler kv:namespace create INTERACTION_LOG
# That command prints { id = "…" } — paste it below before the first deploy.
# For local `wrangler dev` you can also generate a preview namespace:
#   wrangler kv:namespace create INTERACTION_LOG --preview
[[kv_namespaces]]
binding = "INTERACTION_LOG"
id = "906303287ee844fdb3f852d2bc5a32b6"
# preview_id = "REPLACE_WITH_PREVIEW_ID"  # optional, for wrangler dev

# ── Rate limiting (config-only binding - no namespace to provision) ────────
# Caps abusive bursts per visitor fingerprint (hashed IP + UA). A real visitor
# never trips these; a script hammering the endpoint gets 429 / silent-dropped.
# `period` must be 10 or 60 (seconds). The worker no-ops gracefully if these
# bindings are absent, so an older deploy keeps working.
[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "TRACK_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 40, period = 60 }
