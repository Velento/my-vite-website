<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Strona nie znaleziona | Legal Line</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="theme-color" content="#1a2332" />
    <style>
      :root {
        --color-primary: #1a2332;
        --color-accent: #b8943e;
        --color-accent-hover: #a3822f;
        --color-text: #1d2939;
        --color-text-secondary: #5d6b82;
        --color-bg: #f9f9fa;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .code {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(7rem, 22vw, 12rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 600;
        color: var(--color-primary);
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--color-text-secondary);
        max-width: 480px;
        line-height: 1.7;
        margin: 0 0 2rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }
      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        transition:
          background-color 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn-primary {
        background: var(--color-accent);
        color: white;
        box-shadow: 0 4px 16px rgba(184, 148, 62, 0.35);
      }
      .btn-primary:hover {
        background: var(--color-accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 22px rgba(184, 148, 62, 0.45);
      }
      .btn-secondary {
        background: transparent;
        color: var(--color-primary);
        border: 1px solid #e8e8ec;
      }
      .btn-secondary:hover {
        background: white;
        border-color: var(--color-primary);
      }
      footer {
        padding: 1.5rem;
        text-align: center;
        color: var(--color-text-secondary);
        font-size: 0.8rem;
        border-top: 1px solid #e8e8ec;
      }
      footer a {
        padding: 0;
        color: var(--color-accent);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>Ta strona nie istnieje</h1>
      <p>
        Adres, którego szukasz, mógł zostać przeniesiony lub usunięty. Wróć na stronę główną albo
        zadzwoń — chętnie pomożemy z Twoimi dokumentami.
      </p>
      <div class="actions">
        <a href="/" class="btn-primary">Wróć na stronę główną</a>
        <a href="tel:+48883734171" class="btn-secondary">📞 +48 883 734 171</a>
      </div>
    </main>
    <footer>
      Legal Line · Gdańsk · <a href="mailto:legalline.pl@gmail.com">legalline.pl@gmail.com</a>
    </footer>
  </body>
</html>
