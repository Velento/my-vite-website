server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── SPA routing — все пути ведут на index.html ────────────────────────────
    location /legal_line/ {
        try_files $uri $uri/ /legal_line/index.html;
    }

    # Редирект с корня на /legal_line/
    location = / {
        return 301 /legal_line/;
    }

    # ── Кеширование статических ресурсов ─────────────────────────────────────
    # JS/CSS с хешами в имени — кешируем на год
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Изображения — кешируем на неделю
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Отключаем логи для health checks ─────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK";
    }

    # ── Запрещаем доступ к скрытым файлам ────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
